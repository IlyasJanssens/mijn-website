    <main class="container flex-grow-1 d-flex align-items-center">
        <section class="w-100 my-5">
            <h1 class="display-5 fw-bold text-center mb-5">Neem contact op!</h1>
            
            <div class="row">
                <div class="col-12 col-md-6 mb-4 mb-md-0">
                    <form id="contactForm" class="contact-form" name="contact" method="POST" data-netlify="true">
                        <input type="hidden" name="form-name" value="contact" />
                        <div class="mb-3">
                            <label for="name" class="form-label">Naam <span>*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="Ilyas Janssens">
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail <span>*</span></label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="ilyas.janssens@student.ap.be">
                        </div>
                        
                        <div class="mb-3">
                            <label for="phone" class="form-label">Telefoonnummer</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+32 456 12 34 56">
                        </div>
                        
                        <div class="mb-3">
                            <label for="subject" class="form-label">Onderwerp <span>*</span></label>
                            <input type="text" class="form-control" id="subject" name="subject" required placeholder="Onderwerp van je bericht">
                        </div>
                        
                        <div class="mb-3">
                            <label for="message" class="form-label">Bericht <span>*</span></label>
                            <textarea class="form-control" id="message" name="message" rows="5" required placeholder="Typ hier je bericht..."></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Verstuur bericht</button>
                    </form>
                </div>
                
                <div class="col-12 col-md-6">
                    <div class="contact-info">
                        <h3 class="h4 fw-bold mb-4">Contactgegevens</h3>
                        
                        <div class="contact-item mb-4">
                            <div class="d-flex align-items-start">
                                <div class="contact-icon me-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                                    </svg>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-2">Adres</h5>
                                    <p class="text-muted mb-0">Noorderplaats 2<br>2000 Antwerpen<br>België</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="contact-item mb-4">
                            <div class="d-flex align-items-start">
                                <div class="contact-icon me-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z"/>
                                    </svg>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-2">E-mail</h5>
                                    <p class="mb-0">
                                        <a href="mailto:ilyas.janssens@outlook.com" class="text-decoration-none">ilyas.janssens@outlook.com</a>
                                    </p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="contact-item mb-4">
                            <div class="d-flex align-items-start">
                                <div class="contact-icon me-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122l-2.19.547a1.745 1.745 0 0 1-1.657-.459L5.482 8.062a1.745 1.745 0 0 1-.46-1.657l.548-2.19a.678.678 0 0 0-.122-.58L3.654 1.328zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z"/>
                                    </svg>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-2">Telefoon</h5>
                                    <p class="mb-0">
                                        <a href="tel:+32123456789" class="text-decoration-none">+32 456 12 34 56</a>
                                    </p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <h5 class="mb-3">Volg mij</h5>
                            <div class="social-links-contact">
                                <a href="https://www.linkedin.com/in/ilyas-janssens-7664b838a" target="_blank" rel="noopener noreferrer" class="me-3" aria-label="LinkedIn">

                                    <i class="bi bi-twitter-x fs-4"></i>
                                </a>
                            </div>
                        </div>
                    </div>
